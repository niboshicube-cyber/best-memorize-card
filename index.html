<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>最高の暗記カード</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #172033;
}

body {
    overscroll-behavior: none;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

.app {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    min-height: 100vh;
}

header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: white;
    border-bottom: 1px solid #e5e8ef;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.header-button {
    border: 0;
    background: #eef2f8;
    color: #172033;
    border-radius: 10px;
    padding: 9px 14px;
    font-weight: 700;
}

.screen {
    display: none;
    padding: 24px 18px 40px;
}

.screen.active {
    display: block;
}

h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

h2 {
    margin: 0 0 16px;
    font-size: 21px;
}

.subtitle {
    color: #697386;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
}

.section {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid #e7eaf0;
}

.section-title {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 12px;
}

textarea {
    width: 100%;
    min-height: 300px;
    resize: vertical;
    border: 2px solid #dfe4ed;
    border-radius: 14px;
    padding: 16px;
    font-size: 17px;
    line-height: 1.7;
    outline: none;
    background: #fbfcfe;
}

textarea:focus {
    border-color: #5577e8;
    background: white;
}

.setting-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.setting {
    min-width: 0;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #697386;
    margin-bottom: 7px;
}

select,
input[type="text"] {
    width: 100%;
    border: 1px solid #dfe4ed;
    border-radius: 10px;
    background: #fbfcfe;
    padding: 11px 12px;
    outline: none;
}

select:focus,
input[type="text"]:focus {
    border-color: #5577e8;
}

.custom-input {
    margin-top: 8px;
    display: none;
}

.custom-input.show {
    display: block;
}

.preview {
    background: #f6f8fc;
    border-radius: 12px;
    padding: 12px;
    max-height: 260px;
    overflow: auto;
}

.preview-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
}

.preview-side {
    min-width: 0;
}

.preview-select {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #697386;
    padding-bottom: 4px;
}

.preview-select input {
    width: 17px;
    height: 17px;
    margin: 0;
}

.preview-select {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #7b8495;
}

.preview-select input {
    width: 15px;
    height: 15px;
}

.preview-label {
    font-size: 10px;
    color: #8a93a5;
    font-weight: 800;
    margin-bottom: 4px;
}

.preview-text {
    word-break: break-word;
    font-size: 14px;
}

.primary {
    width: 100%;
    border: 0;
    border-radius: 14px;
    background: #315bdc;
    color: white;
    padding: 15px;
    font-size: 16px;
    font-weight: 800;
}

.primary:active {
    transform: scale(0.98);
}

.secondary {
    width: 100%;
    border: 1px solid #dfe4ed;
    border-radius: 14px;
    background: white;
    color: #172033;
    padding: 14px;
    font-weight: 700;
}

.deck {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 16px;
    padding: 17px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.deck-info {
    min-width: 0;
    flex: 1;
}

.deck-name {
    font-weight: 800;
    font-size: 17px;
    margin-bottom: 6px;
    word-break: break-word;
}

.deck-count {
    font-size: 12px;
    color: #7b8495;
}

.deck-actions {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
}

.deck-button,
.edit-button,
.delete-button {
    border: 0;
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: 700;
}

.deck-button {
    background: #315bdc;
    color: white;
}

.edit-button {
    background: #eef2f8;
    color: #172033;
}

.delete-button {
    background: #fff0f0;
    color: #c43b3b;
}

.empty {
    text-align: center;
    color: #7b8495;
    padding: 40px 20px;
    background: white;
    border-radius: 16px;
    border: 1px solid #e5e8ef;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
}

.stat {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 13px;
    padding: 12px 8px;
    text-align: center;
}

.stat-number {
    font-size: 20px;
    font-weight: 800;
}

.stat-label {
    font-size: 10px;
    color: #7b8495;
    margin-top: 3px;
}

.study-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.study-info {
    font-size: 13px;
    color: #697386;
}

.phase-info {
    font-weight: 800;
    color: #315bdc;
    margin-top: 3px;
}

.progress {
    height: 7px;
    background: #e5e8ef;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 22px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #315bdc;
    transition: width 0.25s ease;
}

.card-area {
    width: 100%;
    height: min(65vh, 500px);
    min-height: 360px;
    perspective: 1200px;
    touch-action: pan-y;
    user-select: none;
}

.flashcard {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.16s ease;
    cursor: pointer;
}

.flashcard.flipped {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 24px;
    background: white;
    border: 1px solid #e3e7ef;
    box-shadow: 0 12px 35px rgba(20, 30, 55, 0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
}

.card-back {
    transform: rotateY(180deg);
    background: #f8faff;
}

.card-text {
    font-size: clamp(22px, 6vw, 42px);
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
    white-space: pre-wrap;
}

.card-hint {
    position: absolute;
    bottom: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #929aaa;
    font-size: 12px;
}

.swipe-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 18px;
}

.swipe-button {
    border: 0;
    border-radius: 15px;
    padding: 15px;
    font-size: 15px;
    font-weight: 800;
}

.unknown {
    background: #fff0f0;
    color: #c43b3b;
}

.known {
    background: #eefaf2;
    color: #21804a;
}

.study-message {
    text-align: center;
    font-size: 14px;
    color: #697386;
    margin-top: 12px;
    min-height: 20px;
}

.study-empty {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
}

.study-empty-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 10px;
}

.study-empty-text {
    color: #697386;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 20px;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(12, 18, 30, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow: auto;
    background: white;
    border-radius: 20px;
    padding: 22px;
}

.modal-title {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 16px;
}

.modal-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
}

.danger {
    width: 100%;
    border: 0;
    border-radius: 14px;
    background: #fff0f0;
    color: #c43b3b;
    padding: 14px;
    font-weight: 800;
}

@media (max-width: 520px) {
    .screen {
        padding-left: 14px;
        padding-right: 14px;
    }

    header {
        padding: 0 15px;
    }

    textarea {
        min-height: 260px;
    }

    .setting-row {
        grid-template-columns: 1fr;
    }

    .card-area {
        height: 58vh;
        min-height: 330px;
    }

    .deck {
        align-items: flex-start;
    }

    .deck-actions {
        flex-direction: column;
    }

    .deck-button,
    .edit-button,
    .delete-button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">最高の暗記カード</div>
    <button type="button" class="header-button" id="homeButton">ホーム</button>
</header>

<section class="screen active" id="homeScreen">

    <h1>暗記カード</h1>

    <div class="subtitle">
        覚えられていないカードを重点的に復習しよう。
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="deckCount">0</div>
            <div class="stat-label">カード束</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="cardCount">0</div>
            <div class="stat-label">カード</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="phaseCount">0</div>
            <div class="stat-label">復習対象</div>
        </div>
    </div>

    <button
        type="button"
        class="primary"
        id="createButton"
        onclick="showScreen('create'); startCreate();">
        ＋ 新しいカード束を作る
    </button>
    <div style="height:20px"></div>

    <h2>カード束</h2>

    <div id="deckList"></div>

</section>

<section class="screen" id="createScreen">

    <h1>カードを作る</h1>

    <div class="subtitle">
        文章をまとめて入力し、区切り方を指定してください。
    </div>

    <div class="section">

        <div class="section-title">
            カードの内容
        </div>

        <textarea
            id="cardInput"
            placeholder="apple りんご
banana バナナ
orange オレンジ"></textarea>

    </div>

    <div class="section">

        <div class="section-title">
            区切り設定
        </div>

        <div class="setting-row">

            <div class="setting">

                <label>
                    問題と答えの区切り
                </label>

                <select id="pairDelimiter">

                    <option value=" ">
                        半角スペース
                    </option>

                    <option value="　">
                        全角スペース
                    </option>

                    <option value=",">
                        カンマ ,
                    </option>

                    <option value="|">
                        縦線 |
                    </option>

                    <option value="→">
                        矢印 →
                    </option>

                    <option value="custom">
                        自分で指定
                    </option>

                </select>

                <input
                    class="custom-input"
                    id="pairCustom"
                    type="text"
                    placeholder="例：="
                >

            </div>

            <div class="setting">

                <label>
                    カードの区切り
                </label>

                <select id="cardDelimiter">

                    <option value="newline">
                        改行
                    </option>

                    <option value="double-newline">
                        改行2回
                    </option>

                    <option value=",">
                        カンマ ,
                    </option>

                    <option value="|">
                        縦線 |
                    </option>

                    <option value="custom">
                        自分で指定
                    </option>

                </select>

                <input
                    class="custom-input"
                    id="cardCustom"
                    type="text"
                    placeholder="例：;"
                >

            </div>

        </div>

    </div>

    <div class="section">

        <div class="section-title">
            プレビュー
        </div>

        <div
            style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">

            <button
                type="button"
                class="secondary"
                id="swapSelectedCardsButton"
                style="width:auto;padding:10px 13px;">
                選択したカードを表裏入れ替え
        　  </button>

            <button
                type="button"
                class="secondary"
                id="swapAllCardsButton"
                style="width:auto;padding:10px 13px;">
                全カードを表裏入れ替え
            </button>

            <button
                type="button"
                class="danger"
                id="deleteSelectedCardsButton"
                style="width:auto;padding:10px 13px;">
                選択したカードを削除
            </button>

        </div>

        <div
            class="preview"
            id="editPreview">
        </div>

    </div>

    <button
        type="button"
        class="primary"
        id="makeCardsButton">
        カードを作成する
    </button>

    <div style="height:10px"></div>

    <button
        type="button"
        class="secondary"
        id="cancelCreateButton">
        戻る
    </button>

</section>

<section class="screen" id="nameScreen">

    <h1>カード束を保存</h1>

    <div class="subtitle">
        このカード束に名前をつけてください。
    </div>

    <div class="section">

        <div class="section-title">
            カード束の名前
        </div>

        <input
            id="deckNameInput"
            type="text"
            maxlength="50"
            placeholder="例：英単語"
        >

    </div>

    <div class="section">

        <div class="section-title">
            作成されるカード
        </div>

        <div id="createdCardSummary"></div>

    </div>

    <button
        type="button"
        class="primary"
        id="saveDeckButton">
        保存して暗記する
    </button>

    <div style="height:10px"></div>

    <button
        type="button"
        class="secondary"
        id="cancelNameButton">
        戻る
    </button>

</section>

<section class="screen" id="studyScreen">

    <div class="study-top">

        <div>

            <div
                class="study-info"
                id="studyDeckName">
            </div>

            <div
                class="phase-info"
                id="studyPhase">
            </div>

        </div>

        <button
            type="button"
            class="header-button"
            id="exitStudyButton">
            終了
        </button>

    </div>

    <div class="progress">

        <div
            class="progress-bar"
            id="progressBar">
        </div>

    </div>

    <div id="studyContent">

        <div class="card-area" id="cardArea">

            <div
                class="flashcard"
                id="flashcard">

                <div class="card-face">

                    <div
                        class="card-text"
                        id="frontText">
                    </div>

                    <div class="card-hint">
                        タップして答えを見る
                    </div>

                </div>

                <div class="card-face card-back">

                    <div
                        class="card-text"
                        id="backText">
                    </div>

                    <div class="card-hint">
                        右＝わかった　左＝わからない
                    </div>

                </div>

            </div>

        </div>

        <div class="swipe-buttons">

            <button
                type="button"
                class="swipe-button unknown"
                id="unknownButton">
                ← わからない
            </button>

            <button
                type="button"
                class="swipe-button known"
                id="knownButton">
                わかった →
            </button>

        </div>

        <div
            class="study-message"
            id="studyMessage">
        </div>

    </div>

</section>

</div>

<div class="modal" id="completeModal">

    <div class="modal-box">

        <div class="modal-title">
            今回の復習が終了しました
        </div>

        <div id="completeText"></div>

        <div class="modal-buttons">

            <button
                type="button"
                class="secondary"
                id="completeHomeButton">
                ホームへ
            </button>

            <button
                type="button"
                class="primary"
                id="completeAgainButton">
                全カードを復習
            </button>

        </div>

    </div>

</div>

<div class="modal" id="editModal">

    <div class="modal-box">

        <div class="modal-title">
            カード束を編集
        </div>

        <div class="section">

            <div class="section-title">
                カード束の名前
            </div>

            <input
                id="editDeckName"
                type="text"
                maxlength="50"
            >

        </div>

        <div class="section">

            <div class="section-title">
                カードの内容
            </div>

            <textarea
                id="editCardInput"
                placeholder="apple りんご
banana バナナ
orange オレンジ"></textarea>

        </div>

        <div class="section">

            <div class="section-title">
                区切り設定
            </div>

            <div class="setting-row">

                <div class="setting">

                    <label>
                        問題と答えの区切り
                    </label>

                    <select id="editPairDelimiter">

                        <option value=" ">
                            半角スペース
                        </option>

                        <option value="　">
                            全角スペース
                        </option>

                        <option value=",">
                            カンマ ,
                        </option>

                        <option value="|">
                            縦線 |
                        </option>

                        <option value="→">
                            矢印 →
                        </option>

                        <option value="custom">
                            自分で指定
                        </option>

                    </select>

                    <input
                        class="custom-input"
                        id="editPairCustom"
                        type="text"
                        placeholder="例：="
                    >

                </div>

                <div class="setting">

                    <label>
                        カードの区切り
                    </label>

                    <select id="editCardDelimiter">

                        <option value="newline">
                            改行
                        </option>

                        <option value="double-newline">
                            改行2回
                        </option>

                        <option value=",">
                            カンマ ,
                        </option>

                        <option value="|">
                            縦線 |
                        </option>

                        <option value="custom">
                            自分で指定
                        </option>

                    </select>

                    <input
                        class="custom-input"
                        id="editCardCustom"
                        type="text"
                        placeholder="例：;"
                    >

                </div>

            </div>

        </div>

        <div class="section">

            <div class="section-title">
                プレビュー
            </div>

            <div
                style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">

                <button
                    type="button"
                    class="secondary"
                    id="swapSelectedCardsButton"
                    style="width:auto;padding:10px 13px;">
                    選択したカードを表裏入れ替え
                </button>

                <button
                    type="button"
                    class="secondary"
                    id="swapAllCardsButton"
                    style="width:auto;padding:10px 13px;">
                    全カードを表裏入れ替え
                </button>

            </div>

            <div
                class="preview"
                id="editPreview">
            </div>

        </div>

        <div class="modal-buttons">

            <button
                type="button"
                class="secondary"
                id="cancelEditButton">
                キャンセル
            </button>

            <button
                type="button"
                class="primary"
                id="saveEditButton">
                保存
            </button>

        </div>

    </div>

</div>

<div class="modal" id="deleteModal">

    <div class="modal-box">

        <div class="modal-title">
            カード束を削除
        </div>

        <div id="deleteText"></div>

        <div class="modal-buttons">

            <button
                type="button"
                class="secondary"
                id="cancelDeleteButton">
                キャンセル
            </button>

            <button
                type="button"
                class="danger"
                id="confirmDeleteButton">
                削除する
            </button>

        </div>

    </div>

</div>

<script>
const STORAGE_KEY = "bestMemorizeCardDataV2";

let appData = loadData();
let createdCards = [];
let currentDeckId = null;
let studyQueue = [];
let currentCardIndex = 0;
let editingDeckId = null;
let deletingDeckId = null;
let lastCreateDuplicateSignature = "";
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

const screens = {
    home: document.getElementById("homeScreen"),
    create: document.getElementById("createScreen"),
    name: document.getElementById("nameScreen"),
    study: document.getElementById("studyScreen")
};

function loadData() {
    try {
        const oldData = localStorage.getItem("bestMemorizeCardDataV1");
        const newData = localStorage.getItem(STORAGE_KEY);

        if (newData) {
            const parsed = JSON.parse(newData);

            if (parsed && Array.isArray(parsed.decks)) {
                normalizeData(parsed);
                return parsed;
            }
        }

        if (oldData) {
            const parsed = JSON.parse(oldData);

            if (parsed && Array.isArray(parsed.decks)) {
                normalizeData(parsed);
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(parsed)
                );
                return parsed;
            }
        }
    } catch (e) {}

    return {
        decks: []
    };
}

function normalizeData(data) {
    data.decks.forEach(deck => {
        deck.cards = Array.isArray(deck.cards)
            ? deck.cards
            : [];

        deck.cards.forEach(card => {
            card.phase = Number(card.phase) || 1;
            card.reviews = Number(card.reviews) || 0;
            card.lapses = Number(card.lapses) || 0;
            card.dueAt = Number(card.dueAt) || 0;

            if (!card.id) {
                card.id =
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .slice(2);
            }
        });
    });
}

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function getPairDelimiter(prefix = "") {
    const selectId =
        prefix
            ? prefix + "PairDelimiter"
            : "pairDelimiter";

    const customId =
        prefix
            ? prefix + "PairCustom"
            : "pairCustom";

    const select =
        document.getElementById(
            selectId
        );

    const value = select.value;

    if (value === "custom") {
        return document.getElementById(
            customId
        ).value;
    }

    return value;
}
function getCardDelimiter(prefix = "") {
    const selectId =
        prefix
            ? prefix + "CardDelimiter"
            : "cardDelimiter";

    const customId =
        prefix
            ? prefix + "CardCustom"
            : "cardCustom";

    const select =
        document.getElementById(
            selectId
        );

    const value = select.value;

    if (value === "newline") {
        return "\n";
    }

    if (value === "double-newline") {
        return "\n\n";
    }

    if (value === "custom") {
        return document.getElementById(
            customId
        ).value;
    }

    return value;
}

function splitCards(text, delimiter) {
    if (!delimiter) {
        return [];
    }

    if (delimiter === "\n\n") {
        return text.split(/\n\s*\n/);
    }

    return text.split(delimiter);
}

function parseCardText(text, prefix = "") {
    const pairDelimiter =
        getPairDelimiter(prefix);

    const cardDelimiter =
        getCardDelimiter(prefix);

    if (!text.trim()) {
        return [];
    }

    if (!pairDelimiter || !cardDelimiter) {
        return [];
    }

    const rawCards =
        splitCards(
            text.trim(),
            cardDelimiter
        );

    const result = [];

    rawCards.forEach(raw => {
        const cleaned = raw.trim();

        if (!cleaned) {
            return;
        }

        const index =
            cleaned.indexOf(pairDelimiter);

        if (index === -1) {
            result.push({
                front: cleaned,
                back: ""
            });

            return;
        }

        const front =
            cleaned
                .slice(0, index)
                .trim();

        const back =
            cleaned
                .slice(
                    index +
                    pairDelimiter.length
                )
                .trim();

        if (front || back) {
            result.push({
                front,
                back
            });
        }
    });

    return result;
}

function updateCreatePreview() {
    const cards =
        parseCardText(
            document.getElementById(
                "cardInput"
            ).value
        );

    const groups = new Map();

    cards.forEach((card, index) => {
        const key =
            card.front +
            "\u0000" +
            card.back;

        if (!groups.has(key)) {
            groups.set(key, []);
        }

        groups.get(key).push(index);
    });

    const duplicates =
        [...groups.entries()]
            .filter(
                ([key, indexes]) =>
                    indexes.length > 1
            );

    if (duplicates.length === 0) {
        lastCreateDuplicateSignature = "";
    } else {
        const signature =
            duplicates
                .map(
                    ([key, indexes]) =>
                        key +
                        "\u0001" +
                        indexes.length
                )
                .join("\u0002");

        if (
            signature !==
            lastCreateDuplicateSignature
        ) {
            lastCreateDuplicateSignature =
                signature;

            const [
                key
            ] = duplicates[0];

            const [
                front,
                back
            ] = key.split("\u0000");

            const shouldDelete =
                confirm(
                    `表「${front}」、裏「${back}」のカードが複数存在します。削除しますか？`
                );

            if (shouldDelete) {
                const duplicateIndexes =
                    new Set(
                        duplicates
                            .flatMap(
                                ([, indexes]) =>
                                    indexes.slice(1)
                            )
                    );

                const pairDelimiter =
                    getPairDelimiter();

                const cardDelimiter =
                    getCardDelimiter();

                const newText =
                    cards
                        .filter(
                            (_, index) =>
                                !duplicateIndexes.has(
                                    index
                                )
                        )
                        .map(
                            card =>
                                card.front +
                                pairDelimiter +
                                card.back
                        )
                        .join(cardDelimiter);

                document.getElementById(
                    "cardInput"
                ).value = newText;

                lastCreateDuplicateSignature =
                    "";

                updateCreatePreview();

                return;
            }
        }
    }

    renderPreview(
        "createPreview",
        cards
    );
}

    let indexes = [];

    if (swapAll) {

        indexes =
            cards.map(
                (_, index) =>
                    index
            );

    } else {

        indexes =
            [
                ...document.querySelectorAll(
                    ".edit-card-select:checked"
                )
            ].map(
                checkbox =>
                    Number(
                        checkbox.dataset
                            .index
                    )
            );

    indexes.forEach(index => {

            temp;

    });

    const name =
        document.getElementById(

        alert(

function shuffle(array) {
    const result =
        [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {
        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];
    }

    return result;
}

function startStudy(
    deckId,
    forceAll = false
) {
    const deck =
        appData.decks.find(
            d => d.id === deckId
        );

    if (!deck || deck.cards.length === 0) {
        return;
    }

    currentDeckId = deckId;

    let cards;

    if (forceAll) {
        cards =
            shuffle(deck.cards);
    } else {
        cards =
            shuffle(
                getDueCards(deck)
            );
    }

    if (cards.length === 0) {
        showNoDueCards(deck);
        return;
    }

    studyQueue =
        cards.map(card => ({
            card,
            sessionState: "pending"
        }));

    currentCardIndex = 0;

    document.getElementById(
        "studyDeckName"
    ).textContent =
        deck.name;

    showScreen("study");

    showCurrentCard();
}

        "今日の復習はありません";

    const content =
        document.getElementById(
            "studyContent"
        );

    Array.from(
        content.children
    ).forEach(child => {
        child.style.display = "none";
    });

    const empty =
        document.createElement("div");

    empty.id = "studyEmpty";
    empty.className = "study-empty";

    empty.innerHTML = `
        <div class="study-empty-title">
            今日はここまで！
        </div>

        <div class="study-empty-text">
            現在、復習する期限になっているカードはありません。<br>
            もう一度練習したい場合は、全カードを復習できます。
        </div>

        <button
            type="button"
            class="primary"
            id="studyAllButton">
            全カードを今すぐ復習
        </button>

        <div style="height:10px"></div>

        <button
            type="button"
            class="secondary"
            id="studyHomeButton">
            ホームへ
        </button>
    `;

    content.appendChild(empty);

    document.getElementById(
        "studyAllButton"
    ).addEventListener(
        "click",
        () => {
            restoreStudyContent();
            startStudy(
                deck.id,
                true
            );
        }
    );

    document.getElementById(
        "studyHomeButton"
    ).addEventListener(
        "click",
        () => {
            restoreStudyContent();
            renderDeckList();
            showScreen("home");
        }
    );
}

function showCurrentCard() {
    if (
        currentCardIndex >=
        studyQueue.length
    ) {
        finishStudy();
        return;
    }

    const item =
        studyQueue[
            currentCardIndex
        ];

    const card =
        item.card;

    const flashcard =
        document.getElementById(
            "flashcard"
        );

    const updateCard =
        () => {
            document.getElementById(
                "frontText"
            ).textContent =
                card.front;

            document.getElementById(
                "backText"
            ).textContent =
                card.back;

            flashcard.classList.remove(
                "flipped"
            );

            const remaining =
                studyQueue.length -
                currentCardIndex;

            document.getElementById(
                "progressBar"
            ).style.width =
                `${Math.min(
                    100,
                    (currentCardIndex /
                        Math.max(
                            1,
                            studyQueue.length
                        )) *
                        100
                )}%`;

            document.getElementById(
                "studyPhase"
            ).textContent =
                `Phase ${card.phase}`;

            document.getElementById(
                "studyMessage"
            ).textContent =
                `${currentCardIndex + 1} / ${studyQueue.length}　残り ${remaining}枚`;
        };

    if (
        flashcard.classList.contains(
            "flipped"
        )
    ) {
        flashcard.classList.remove(
            "flipped"
        );

        setTimeout(
            updateCard,
            170
        );

        return;
    }

    updateCard();
}

function flipCard() {
    document.getElementById(
        "flashcard"
    ).classList.toggle(
        "flipped"
    );
}

document.addEventListener(
    "keydown",
    event => {
        if (
            !document.getElementById(
                "studyScreen"
            ).classList.contains("active")
        ) {
            return;
        }

        if (event.code === "Space") {
            event.preventDefault();
            flipCard();
            return;
        }

        if (event.key === "ArrowRight") {
            event.preventDefault();
            rateCard(true);
            return;
        }

        if (event.key === "ArrowLeft") {
            event.preventDefault();
            rateCard(false);
        }
    }
);

function getIntervalMs(phase) {
    const intervals = {
        1: 10 * 60 * 1000,
        2: 24 * 60 * 60 * 1000,
        3: 3 * 24 * 60 * 60 * 1000,
        4: 7 * 24 * 60 * 60 * 1000,
        5: 30 * 24 * 60 * 60 * 1000
    };

    return (
        intervals[
            Math.min(
                5,
                Math.max(
                    1,
                    phase
                )
            )
        ]
    );
}

function rateCard(known) {
    const item =
        studyQueue[
            currentCardIndex
        ];

    if (!item) {
        return;
    }

    const card =
        item.card;

    const deck =
        appData.decks.find(
            d =>
                d.id ===
                currentDeckId
        );

    if (!deck) {
        return;
    }

    const savedCard =
        deck.cards.find(
            c =>
                c.id ===
                card.id
        );

    if (!savedCard) {
        return;
    }

    savedCard.reviews++;

    if (known) {

        savedCard.phase =
            Math.min(
                5,
                savedCard.phase + 1
            );

        savedCard.dueAt =
            Date.now() +
            getIntervalMs(
                savedCard.phase
            );

        item.sessionState =
            "known";

        currentCardIndex++;

    } else {

        savedCard.phase =
            Math.max(
                1,
                savedCard.phase - 1
            );

        savedCard.lapses++;

        savedCard.dueAt =
            Date.now() +
            10 * 60 * 1000;

        item.sessionState =
            "again";

        currentCardIndex++;

        const remaining =
            studyQueue.length -
            currentCardIndex;

        const insertOffset =
            Math.min(
                3 +
                Math.floor(
                    Math.random() * 3
                ),
                Math.max(
                    1,
                    remaining
                )
            );

        const targetIndex =
            currentCardIndex +
            insertOffset;

        studyQueue.splice(
            targetIndex,
            0,
            {
                card,
                sessionState:
                    "requeued"
            }
        );
    }

    saveData();

    showCurrentCard();
}

function finishStudy() {
    const deck =
        appData.decks.find(
            d =>
                d.id ===
                currentDeckId
        );

    if (!deck) {
        return;
    }

    const average =
        deck.cards.reduce(
            (sum, card) =>
                sum +
                card.phase,
            0
        ) /
        deck.cards.length;

    const dueCount =
        getDueCards(
            deck
        ).length;

    document.getElementById(
        "completeText"
    ).innerHTML = `
        <div style="font-size:16px;margin-bottom:8px;">
            ${escapeHtml(deck.name)}
        </div>

        <div style="color:#697386;font-size:14px;line-height:1.8;">
            今回の復習：${studyQueue.length}枚<br>
            平均Phase：${average.toFixed(1)}<br>
            次に復習するカード：${dueCount}枚
        </div>
    `;

    document.getElementById(
        "completeModal"
    ).classList.add("show");

    saveData();
}

const cardArea =
    document.getElementById(
        "cardArea"
    );

cardArea.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !== 1
        ) {
            return;
        }

        isDragging = true;

        dragStartX =
            event.touches[0]
                .clientX;

        dragStartY =
            event.touches[0]
                .clientY;

    },
    {
        passive: true
    }
);

cardArea.addEventListener(
    "touchend",
    event => {

        if (!isDragging) {
            return;
        }

        isDragging = false;

        const endX =
            event.changedTouches[0]
                .clientX;

        const endY =
            event.changedTouches[0]
                .clientY;

        const dx =
            endX -
            dragStartX;

        const dy =
            endY -
            dragStartY;

        if (
            Math.abs(dx) < 60 ||
            Math.abs(dx) <
                Math.abs(dy)
        ) {
            return;
        }

        if (dx > 0) {
            rateCard(true);
        } else {
            rateCard(false);
        }

    },
    {
        passive: true
    }
);
