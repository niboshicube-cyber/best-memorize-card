<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>最高の暗記カード</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #172033;
}

body {
    overscroll-behavior: none;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

.app {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    min-height: 100vh;
}

header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: white;
    border-bottom: 1px solid #e5e8ef;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.header-button {
    border: 0;
    background: #eef2f8;
    color: #172033;
    border-radius: 10px;
    padding: 9px 14px;
    font-weight: 700;
}

.screen {
    display: none;
    padding: 24px 18px 40px;
}

.screen.active {
    display: block;
}

h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

h2 {
    margin: 0 0 16px;
    font-size: 21px;
}

.subtitle {
    color: #697386;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
}

.section {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid #e7eaf0;
}

.section-title {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 12px;
}

textarea {
    width: 100%;
    min-height: 300px;
    resize: vertical;
    border: 2px solid #dfe4ed;
    border-radius: 14px;
    padding: 16px;
    font-size: 17px;
    line-height: 1.7;
    outline: none;
    background: #fbfcfe;
}

textarea:focus {
    border-color: #5577e8;
    background: white;
}

.setting-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.setting {
    min-width: 0;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #697386;
    margin-bottom: 7px;
}

select,
input[type="text"] {
    width: 100%;
    border: 1px solid #dfe4ed;
    border-radius: 10px;
    background: #fbfcfe;
    padding: 11px 12px;
    outline: none;
}

select:focus,
input[type="text"]:focus {
    border-color: #5577e8;
}

.custom-input {
    margin-top: 8px;
    display: none;
}

.custom-input.show {
    display: block;
}

.preview {
    background: #f6f8fc;
    border-radius: 12px;
    padding: 12px;
    max-height: 260px;
    overflow: auto;
}

.preview-card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
}

.preview-side {
    min-width: 0;
}

.preview-label {
    font-size: 10px;
    color: #8a93a5;
    font-weight: 800;
    margin-bottom: 4px;
}

.preview-text {
    word-break: break-word;
    font-size: 14px;
}

.primary {
    width: 100%;
    border: 0;
    border-radius: 14px;
    background: #315bdc;
    color: white;
    padding: 15px;
    font-size: 16px;
    font-weight: 800;
}

.primary:active {
    transform: scale(0.98);
}

.secondary {
    width: 100%;
    border: 1px solid #dfe4ed;
    border-radius: 14px;
    background: white;
    color: #172033;
    padding: 14px;
    font-weight: 700;
}

.deck {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 16px;
    padding: 17px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.deck-info {
    min-width: 0;
    flex: 1;
}

.deck-name {
    font-weight: 800;
    font-size: 17px;
    margin-bottom: 6px;
    word-break: break-word;
}

.deck-count {
    font-size: 12px;
    color: #7b8495;
}

.deck-actions {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
}

.deck-button,
.edit-button,
.delete-button {
    border: 0;
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: 700;
}

.deck-button {
    background: #315bdc;
    color: white;
}

.edit-button {
    background: #eef2f8;
    color: #172033;
}

.delete-button {
    background: #fff0f0;
    color: #c43b3b;
}

.empty {
    text-align: center;
    color: #7b8495;
    padding: 40px 20px;
    background: white;
    border-radius: 16px;
    border: 1px solid #e5e8ef;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
}

.stat {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 13px;
    padding: 12px 8px;
    text-align: center;
}

.stat-number {
    font-size: 20px;
    font-weight: 800;
}

.stat-label {
    font-size: 10px;
    color: #7b8495;
    margin-top: 3px;
}

.study-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.study-info {
    font-size: 13px;
    color: #697386;
}

.phase-info {
    font-weight: 800;
    color: #315bdc;
    margin-top: 3px;
}

.progress {
    height: 7px;
    background: #e5e8ef;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 22px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #315bdc;
    transition: width 0.25s ease;
}

.card-area {
    width: 100%;
    height: min(65vh, 500px);
    min-height: 360px;
    perspective: 1200px;
    touch-action: pan-y;
    user-select: none;
}

.flashcard {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.16s ease;
    cursor: pointer;
}

.flashcard.flipped {
    transform: rotateY(180deg);
}

.flashcard.no-transition {
    transition: none !important;
}

.card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 24px;
    background: white;
    border: 1px solid #e3e7ef;
    box-shadow: 0 12px 35px rgba(20, 30, 55, 0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
}

.card-back {
    transform: rotateY(180deg);
    background: #f8faff;
}

.card-text {
    font-size: clamp(22px, 6vw, 42px);
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
    white-space: pre-wrap;
}

.card-hint {
    position: absolute;
    bottom: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #929aaa;
    font-size: 12px;
}

.swipe-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 18px;
}

.swipe-button {
    border: 0;
    border-radius: 15px;
    padding: 15px;
    font-size: 15px;
    font-weight: 800;
}

.unknown {
    background: #fff0f0;
    color: #c43b3b;
}

.known {
    background: #eefaf2;
    color: #21804a;
}

.study-message {
    text-align: center;
    font-size: 14px;
    color: #697386;
    margin-top: 12px;
    min-height: 20px;
}

.study-empty {
    background: white;
    border: 1px solid #e5e8ef;
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
}

.study-empty-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 10px;
}

.study-empty-text {
    color: #697386;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 20px;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(12, 18, 30, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow: auto;
    background: white;
    border-radius: 20px;
    padding: 22px;
}

.modal-title {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 16px;
}

.modal-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
}

.danger {
    width: 100%;
    border: 0;
    border-radius: 14px;
    background: #fff0f0;
    color: #c43b3b;
    padding: 14px;
    font-weight: 800;
}

@media (max-width: 520px) {
    .screen {
        padding-left: 14px;
        padding-right: 14px;
    }

    header {
        padding: 0 15px;
    }

    textarea {
        min-height: 260px;
    }

    .setting-row {
        grid-template-columns: 1fr;
    }

    .card-area {
        height: 58vh;
        min-height: 330px;
    }

    .deck {
        align-items: flex-start;
    }

    .deck-actions {
        flex-direction: column;
    }

    .deck-button,
    .edit-button,
    .delete-button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">最高の暗記カード</div>
    <button type="button" class="header-button" id="homeButton">ホーム</button>
</header>

<section class="screen active" id="homeScreen">

</section>

banana バナナ
orange オレンジ"></textarea>

                    <option value=" ">
                        半角スペース
                    </option>

                    <option value="　">
                        全角スペース
                    </option>

                    <option value=",">
                        カンマ ,
                    </option>

                    <option value="|">

                    </option>

                    <option value="→">

            </div>

            <div class="setting">

                    </option>

                <input

        </div>

    <div class="section">

        <button

    </div>

    <button
        type="button"
        class="primary"
        id="makeCardsButton">
        カードを作成する
    </button>

    <div style="height:10px"></div>

    <button
        type="button"
        class="secondary"
        id="cancelCreateButton">
        戻る
    </button>

</section>

<section class="screen" id="nameScreen">

    <h1>カード束を保存</h1>

    <div class="subtitle">
        このカード束に名前をつけてください。
    </div>

    <div class="section">

        <div class="section-title">
            カード束の名前
        </div>

        <input
            id="deckNameInput"
            type="text"
            maxlength="50"

    </div>

    <div class="section">

        <div class="section-title">
            作成されるカード

        <div id="createdCardSummary"></div>

    </div>

    <button

        class="primary"
        id="saveDeckButton">
        保存して暗記する
    </button>

    <button
        type="button"
        class="secondary"
        id="cancelNameButton">
        戻る

</section>

<section class="screen" id="studyScreen">

    <div class="study-top">

        <div>

            <div
                class="study-info"
                id="studyDeckName">
            </div>

            <div
                class="phase-info"

            </div>

        </div>

        <button

</div>

<div class="modal" id="completeModal">

banana バナナ
orange オレンジ"></textarea>

            <button

        <div class="modal-title">
            カード束を削除
        </div>

        <div id="deleteText"></div>

        <div class="modal-buttons">

            <button
                type="button"
                class="secondary"
                id="cancelDeleteButton">
                キャンセル
            </button>

            <button
                type="button"
                class="danger"
                id="confirmDeleteButton">
                削除する
            </button>

        </div>

    </div>

</div>

<script>
const STORAGE_KEY = "bestMemorizeCardDataV2";

let appData = loadData();
let createdCards = [];
let currentDeckId = null;
let studyQueue = [];
let currentCardIndex = 0;
let editingDeckId = null;
let deletingDeckId = null;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

const screens = {
    home: document.getElementById("homeScreen"),
    create: document.getElementById("createScreen"),
    name: document.getElementById("nameScreen"),
    study: document.getElementById("studyScreen")
};

function loadData() {
    try {
        const oldData = localStorage.getItem("bestMemorizeCardDataV1");
        const newData = localStorage.getItem(STORAGE_KEY);

        if (newData) {
            const parsed = JSON.parse(newData);

            if (parsed && Array.isArray(parsed.decks)) {
                normalizeData(parsed);
                return parsed;
            }
        }

        if (oldData) {
            const parsed = JSON.parse(oldData);

            if (parsed && Array.isArray(parsed.decks)) {
                normalizeData(parsed);
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(parsed)
                );
                return parsed;
            }
        }
    } catch (e) {}

    return {
        decks: []
    };
}

function normalizeData(data) {
    data.decks.forEach(deck => {
        deck.cards = Array.isArray(deck.cards)
            ? deck.cards
            : [];

                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .slice(2);

    });
}

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function getPairDelimiter(prefix = "") {
    const selectId =
        prefix
            ? prefix + "PairDelimiter"
            : "pairDelimiter";

    const customId =
        prefix
            ? prefix + "PairCustom"
            : "pairCustom";

    const select =
        document.getElementById(
            selectId
        );

    const value = select.value;

    if (value === "custom") {
        return document.getElementById(
            customId
        ).value;
    }

    return value;
}
function getCardDelimiter(prefix = "") {
    const selectId =
        prefix
            ? prefix + "CardDelimiter"
            : "cardDelimiter";

    const customId =
        prefix
            ? prefix + "CardCustom"
            : "cardCustom";

    const select =
        document.getElementById(
            selectId
        );

    const value = select.value;

    if (value === "newline") {
        return "\n";
    }

    if (value === "double-newline") {
        return "\n\n";
    }

    if (value === "custom") {
        return document.getElementById(
            customId
        ).value;
    }

    return value;
}

function splitCards(text, delimiter) {
    if (!delimiter) {
        return [];
    }

    if (delimiter === "\n\n") {
        return text.split(/\n\s*\n/);
    }

    return text.split(delimiter);
}

function parseCardText(text, prefix = "") {
    const pairDelimiter =
        getPairDelimiter(prefix);

    const cardDelimiter =
        getCardDelimiter(prefix);

    if (!text.trim()) {
        return [];
    }

    if (!pairDelimiter || !cardDelimiter) {
        return [];
    }

    const rawCards =
        splitCards(
            text.trim(),
            cardDelimiter
        );

    const result = [];

    rawCards.forEach(raw => {
        const cleaned = raw.trim();

        if (!cleaned) {
            return;
        }

        const index =
            cleaned.indexOf(pairDelimiter);

        if (index === -1) {
            result.push({
                front: cleaned,
                back: ""
            });

            return;
        }

        const front =
            cleaned
                .slice(0, index)
                .trim();

        const back =
            cleaned
                .slice(
                    index +
                    pairDelimiter.length
                )
                .trim();

        if (front || back) {
            result.push({
                front,
                back
            });
        }
    });

    return result;
}

function swapCards(cards, indexes) {
    const indexSet = indexes === null ? null : new Set(indexes);
    return cards.map((card, index) => {
        if (indexSet === null || indexSet.has(index)) {
            return {
                front: card.back,
                back: card.front
            };
        }
        return card;
    });
}

function swapCreateCards(all) {
    const cards = getCreateCards();
    if (all) {
        writeCreateCards(swapCards(cards, null));
        return;
    }
    const indexes = [...document.querySelectorAll(".create-card-select:checked")].map(
        checkbox => Number(checkbox.dataset.index)
    );
    if (indexes.length === 0) {
        alert("表裏を入れ替えるカードを選択してください。");
        return;
    }
    writeCreateCards(swapCards(cards, indexes));
}

}

function saveEditedDeck() {
    const deck =
        appData.decks.find(
            d => d.id === editingDeckId
        );

    if (!deck) {
        return;
    }

    const name =
        document.getElementById(
            "editDeckName"
        ).value.trim();

    const cards =
        parseCardText(
            document.getElementById(
                "editCardInput"
            ).value,
            "edit"
        );

    if (!name) {
        alert(
            "カード束の名前を入力してください。"
        );

        return;
    }

    if (cards.length === 0) {
        alert(
            "カードを1枚以上入力してください。"
        );

        return;
    }

    if (
        cards.some(
            card =>
                !card.front ||
                !card.back
        )
    ) {
        alert(
            "表と裏の両方が入っていないカードがあります。"
        );

        return;
    }

    const oldCards =
        deck.cards;

    const oldMap =
        new Map(
            oldCards.map(
                card => [
                    card.front +
                    "\u0000" +
                    card.back,
                    card
                ]
            )
        );

    const now = Date.now();

    deck.name = name;
    deck.pairDelimiter =
        document.getElementById(
            "editPairDelimiter"
        ).value;

    deck.cardDelimiter =
        document.getElementById(
            "editCardDelimiter"
        ).value;

    deck.pairCustom =
        document.getElementById(
            "editPairCustom"
        ).value;

    deck.cardCustom =
        document.getElementById(
            "editCardCustom"
        ).value;

    deck.cards =
        cards.map(
            (card, index) => {

                const key =
                    card.front +
                    "\u0000" +
                    card.back;

                const old =
                    oldMap.get(key);

                if (old) {
                    return old;
                }

                return {
                    id:
                        now +
                        "_" +
                        index +
                        "_" +
                        Math.random()
                            .toString(36)
                            .slice(2),

                    front: card.front,
                    back: card.back,

                    phase: 1,
                    reviews: 0,
                    lapses: 0,
                    dueAt: 0
                };
            }
        );

    saveData();

    document.getElementById(
        "editModal"
    ).classList.remove("show");

    renderDeckList();
}

function shuffle(array) {
    const result =
        [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {
        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];
    }

    return result;
}

    const now =

    return deck.cards.filter(

    );
}

function startStudy(
    deckId,
    forceAll = false
) {
    const deck =
        appData.decks.find(
            d => d.id === deckId
        );

    if (!deck || deck.cards.length === 0) {
        return;
    }

    deck.cards.forEach(card => {
        if (card.dueAt === undefined || card.dueAt === null || !Number.isFinite(Number(card.dueAt))) {
            card.dueAt = 0;
        }

        if (card.phase === undefined || card.phase === null) {
            card.phase = 1;
        }
    });

    currentDeckId = deckId;

    let cards;

    if (forceAll) {
        cards =
            shuffle(deck.cards);
    } else {
        cards =
            shuffle(
                getDueCards(deck)
            );
    }

    if (cards.length === 0) {
        showNoDueCards(deck);
        return;
    }

    studyQueue =
        cards.map(card => ({
            card,
            sessionState: "pending"
        }));

    currentCardIndex = 0;

    document.getElementById(
        "studyDeckName"
    ).textContent =
        deck.name;

    showScreen("study");

    showCurrentCard();
}

function showCurrentCard() {
    if (
        currentCardIndex < 0 ||
        currentCardIndex >= studyQueue.length
    ) {
        finishStudy();
        return;
    }

    const item = studyQueue[currentCardIndex];
    const card = item.card;

    const flashcard = document.getElementById("flashcard");
    const frontText = document.getElementById("frontText");
    const backText = document.getElementById("backText");

    flashcard.classList.add("no-transition");
    flashcard.classList.remove("flipped");

    void flashcard.offsetWidth;

    frontText.textContent = card.front;
    backText.textContent = card.back;

    document.getElementById("studyPhase").textContent =
        `フェーズ ${card.phase}`;

    document.getElementById("studyMessage").textContent = "";

    const progress =
        ((currentCardIndex + 1) / studyQueue.length) * 100;

    document.getElementById("progressBar").style.width =
        `${progress}%`;

    requestAnimationFrame(() => {
        flashcard.classList.remove("no-transition");
    });
}

function flipCard() {
    document.getElementById(
        "flashcard"
    ).classList.toggle(
        "flipped"
    );
}

function getIntervalMs(phase) {
    const intervals = {
        1: 10 * 60 * 1000,
        2: 24 * 60 * 60 * 1000,
        3: 3 * 24 * 60 * 60 * 1000,
        4: 7 * 24 * 60 * 60 * 1000,
        5: 30 * 24 * 60 * 60 * 1000
    };

    return (
        intervals[
            Math.min(
                5,
                Math.max(
                    1,
                    phase
                )
            )
        ]
    );
}

function rateCard(known) {
    const item =
        studyQueue[
            currentCardIndex
        ];

    if (!item) {
        return;
    }

    const card =
        item.card;

    const deck =
        appData.decks.find(
            d =>
                d.id ===
                currentDeckId
        );

    if (!deck) {
        return;
    }

    const savedCard =
        deck.cards.find(
            c =>
                c.id ===
                card.id
        );

    if (!savedCard) {
        return;
    }

    savedCard.reviews++;

    if (known) {

        savedCard.phase =
            Math.min(
                5,
                savedCard.phase + 1
            );

        savedCard.dueAt =
            Date.now() +
            getIntervalMs(
                savedCard.phase
            );

        item.sessionState =
            "known";

        currentCardIndex++;

    } else {

        savedCard.phase =
            Math.max(
                1,
                savedCard.phase - 1
            );

        savedCard.lapses++;

        savedCard.dueAt =
            Date.now() +
            10 * 60 * 1000;

        item.sessionState =
            "again";

        currentCardIndex++;

        const remaining =
            studyQueue.length -
            currentCardIndex;

        const insertOffset =
            Math.min(
                3 +
                Math.floor(
                    Math.random() * 3
                ),
                Math.max(
                    1,
                    remaining
                )
            );

        const targetIndex =
            currentCardIndex +
            insertOffset;

        studyQueue.splice(
            targetIndex,
            0,
            {
                card,
                sessionState:
                    "requeued"
            }
        );
    }

    saveData();

    showCurrentCard();
}

function finishStudy() {
    const deck =
        appData.decks.find(
            d =>
                d.id ===
                currentDeckId
        );

    if (!deck) {
        return;
    }

    const average =
        deck.cards.reduce(
            (sum, card) =>
                sum +
                card.phase,
            0
        ) /
        deck.cards.length;

    const dueCount =
        getDueCards(
            deck
        ).length;

    document.getElementById(
        "completeText"
    ).innerHTML = `
        <div style="font-size:16px;margin-bottom:8px;">
            ${escapeHtml(deck.name)}
        </div>

        <div style="color:#697386;font-size:14px;line-height:1.8;">
            今回の復習：${studyQueue.length}枚<br>
            平均Phase：${average.toFixed(1)}<br>
            次に復習するカード：${dueCount}枚
        </div>
    `;

    document.getElementById(
        "completeModal"
    ).classList.add("show");

    saveData();
}

function closeComplete() {
    document.getElementById(
        "completeModal"
    ).classList.remove("show");

    renderDeckList();
    showScreen("home");
}

function restartCurrentDeck() {
    document.getElementById(
        "completeModal"
    ).classList.remove("show");

    startStudy(
        currentDeckId,
        true
    );
}

function bindEvent(
    id,
    event,
    handler
) {
    const element = document.getElementById(id);
    if (element) {
        element.addEventListener(event, handler);
    }
}

bindEvent("homeButton", "click", () => {
    renderDeckList();
    showScreen("home");
});
bindEvent("createButton", "click", startCreate);
bindEvent("cancelCreateButton", "click", () => showScreen("home"));
bindEvent("cancelNameButton", "click", () => showScreen("create"));
bindEvent("makeCardsButton", "click", prepareSave);
bindEvent("saveDeckButton", "click", saveNewDeck);
bindEvent("exitStudyButton", "click", () => {
    renderDeckList();
    showScreen("home");
});
bindEvent("completeHomeButton", "click", closeComplete);
bindEvent("completeAgainButton", "click", restartCurrentDeck);
bindEvent("flashcard", "click", flipCard);
bindEvent("unknownButton", "click", () => rateCard(false));
bindEvent("knownButton", "click", () => rateCard(true));
bindEvent("cardInput", "input", updateCreatePreview);
bindEvent("pairDelimiter", "change", () => {
    updateCustomInputs();
    updateCreatePreview();
});
bindEvent("cardDelimiter", "change", () => {
    updateCustomInputs();
    updateCreatePreview();
});
bindEvent("pairCustom", "input", updateCreatePreview);
bindEvent("cardCustom", "input", updateCreatePreview);
bindEvent("editCardInput", "input", updateEditPreview);
bindEvent("editPairDelimiter", "change", () => {
    updateCustomInputs("edit");
    updateEditPreview();
});
bindEvent("editCardDelimiter", "change", () => {
    updateCustomInputs("edit");
    updateEditPreview();
});
bindEvent("editPairCustom", "input", updateEditPreview);
bindEvent("editCardCustom", "input", updateEditPreview);
bindEvent("saveEditButton", "click", saveEditedDeck);
bindEvent("cancelEditButton", "click", () => {
    document.getElementById("editModal").classList.remove("show");
});
bindEvent("swapSelectedCardsButton", "click", () => swapCreateCards(false));
bindEvent("swapAllCardsButton", "click", () => swapCreateCards(true));
bindEvent("deleteSelectedCardsButton", "click", deleteSelectedCreateCards);
bindEvent("editSwapSelectedCardsButton", "click", () => swapEditCards(false));
bindEvent("editSwapAllCardsButton", "click", () => swapEditCards(true));
bindEvent("deleteSelectedEditCardsButton", "click", deleteSelectedEditCards);
bindEvent("confirmDeleteButton", "click", confirmDeleteDeck);
bindEvent("cancelDeleteButton", "click", () => {
    document.getElementById("deleteModal").classList.remove("show");
});
document.addEventListener("keydown", (event) => {
    if (
        !document.getElementById("studyScreen").classList.contains("active") ||
        studyQueue.length === 0
    ) {
        return;
    }

    if (event.repeat) {
        return;
    }

    if (event.code === "Space") {
        event.preventDefault();
        flipCard();
    }

    if (event.key === "ArrowRight") {
        event.preventDefault();
        rateCard(true);
    }

    if (event.key === "ArrowLeft") {
        event.preventDefault();
        rateCard(false);
    }
});

const cardArea =
    document.getElementById(
        "cardArea"
    );

cardArea.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !== 1
        ) {
            return;
        }

        isDragging = true;

        dragStartX =
            event.touches[0]
                .clientX;

        dragStartY =
            event.touches[0]
                .clientY;

    },
    {
        passive: true
    }
);

cardArea.addEventListener(
    "touchend",
    event => {

        if (!isDragging) {
            return;
        }

        isDragging = false;

        const endX =
            event.changedTouches[0]
                .clientX;

        const endY =
            event.changedTouches[0]
                .clientY;

        const dx =
            endX -
            dragStartX;

        const dy =
            endY -
            dragStartY;

        if (
            Math.abs(dx) < 60 ||
            Math.abs(dx) <
                Math.abs(dy)
        ) {
            return;
        }

        if (dx > 0) {
            rateCard(true);
        } else {
            rateCard(false);
        }

    },
    {
        passive: true
    }
);

renderDeckList();
updateCustomInputs();
updateCustomInputs("edit");
updateCreatePreview();
updateEditPreview();
</script>
